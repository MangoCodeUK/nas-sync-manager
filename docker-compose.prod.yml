# Production stack: PREBUILT images pulled from ghcr.io (the NAS never builds).
# On the NAS:  sh deploy/setup.sh   (first time)  /  sh deploy/update.sh  (updates)
# Or directly: docker compose -f docker-compose.prod.yml up -d
services:
  backend:
    image: ghcr.io/${IMAGE_OWNER:-changeme}/nas-sync-manager-backend:${IMAGE_TAG:-latest}
    container_name: nas-sync-backend
    environment:
      DATABASE_URL: sqlite:////data/nas_sync.db
      # App timezone seed (also configurable later via the Settings page).
      TIMEZONE: ${TZ:-Europe/London}
      TZ: ${TZ:-Europe/London}
      # Optional: pin the Fernet key here. If blank, the backend generates one
      # and persists it on the data volume (/data/app_secret.key).
      APP_SECRET: ${APP_SECRET:-}
    volumes:
      - nassync_data:/data
      # --- NAS shares exposed to rsync jobs --------------------------------
      # rsync cannot copy remote->remote, so the local end of every rsync job
      # must be a real path inside this container. Each share below is one bind
      # mount of the NAS's own storage.
      #
      # CONVENTION (app/services/mounts.py depends on it): a host path /X is
      # mounted at /nas/X, so the container path always encodes the host path.
      # Append ":ro" to make a share source-only - the kernel then makes writes
      # impossible, whatever the app does.
      #
      # To expose another share: uncomment/add one line and redeploy. No code
      # change, no migration. The app reports which shares are mounted and
      # refuses jobs pointing outside them.
      - /Volume1/RsyncTest:/nas/Volume1/RsyncTest
      # - /Volume1/public/Films:/nas/Volume1/public/Films
      # - /Volume1/public/TV Shows:/nas/Volume1/public/TV Shows
      # - /Volume1/public/Photos:/nas/Volume1/public/Photos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - autoheal=true
    restart: unless-stopped

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-changeme}/nas-sync-manager-frontend:${IMAGE_TAG:-latest}
    container_name: nas-sync-frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Restarts any container labelled autoheal=true when its healthcheck fails.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: nas-sync-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  nassync_data:
