# Local-build stack (no GHCR). Builds images from source on this machine.
#   docker compose up -d --build
# The NAS uses docker-compose.prod.yml (prebuilt images) instead.
services:
  backend:
    build: ./backend
    container_name: nas-sync-backend
    environment:
      DATABASE_URL: sqlite:////data/nas_sync.db
      TIMEZONE: ${TZ:-Europe/London}
      TZ: ${TZ:-Europe/London}
      APP_SECRET: ${APP_SECRET:-}
    volumes:
      - nassync_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - autoheal=true
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nas-sync-frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  autoheal:
    # Pinned by digest (the 3 November 2026 image): a pull never changes it unannounced. To move on, pull
    # willfarrell/autoheal:latest, check it, and put its digest here.
    image: willfarrell/autoheal@sha256:deb31d41c5b91399ebb6bd3ceac97f5acd9ecd5fd9b2e2282c05c71fd531898c
    healthcheck:
      interval: 60s   # the image checks itself every 5 seconds
    container_name: nas-sync-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  nassync_data:
