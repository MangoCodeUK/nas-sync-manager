# NAS shares exposed to rsync jobs.
#
# THIS FILE IS THE SHARE LIST. It is the only place shares are configured, and
# it contains nothing else, so adding one is a single line here plus a redeploy -
# no code change, no migration, no hunting through the main compose file.
#
# CONVENTION (app/services/mounts.py depends on it): a host path /X is mounted at
# /nas/X, so the container path always encodes the host path. Append ":ro" to
# make a share source-only - the kernel then makes writes impossible whatever
# the app does, which is worth using for anything you only ever copy FROM.
#
# The app reports which shares are mounted (Jobs -> transport rsync, and the
# Browse page), and refuses a job pointing outside them with the exact line to
# add here.
#
# Keep the list narrow. Every share added widens what a mistake can reach.
services:
  backend:
    volumes:
      # --- test data (safe to experiment with) ---------------------------
      - /Volume1/RsyncTest:/nas/Volume1/RsyncTest

      # --- real data -----------------------------------------------------
      # The whole public share, so browsing over rsync shows the same structure
      # FTP does (Media Library, Software and Assets, ...). Mounting the parent
      # rather than each folder means a new share appears without a redeploy.
      #
      # This is the deliberate widening from the test-only start: rsync jobs can
      # now reach ~5 TB of real data, which is why the deletion guards, the
      # mandatory dry-run and the empty-source abort exist. Narrow it back to
      # individual folders any time by replacing this line.
      - /Volume1/public:/nas/Volume1/public

      # --- ProjectMangoTech's nightly backups, copied to NAS-8TB (appdata/pmt-backups) by one job each ---
      # Read-only: these are only ever copied FROM. The live Core applets' and the till's database dumps, QR Code
      # Manager's, the site service's and Flow's database copies (website deploy/*, Core ADR-047).
      - /Volume1/appData/core-live/backups:/nas/Volume1/appData/core-live/backups:ro
      - /Volume1/appData/lock-box-register/backups:/nas/Volume1/appData/lock-box-register/backups:ro
      - /Volume1/appData/qr-code-manager/backups:/nas/Volume1/appData/qr-code-manager/backups:ro
      - /Volume1/appData/projectmangotech-editor-data/backups:/nas/Volume1/appData/projectmangotech-editor-data/backups:ro
      - /Volume1/appData/coreflow-workspaces-data/backups:/nas/Volume1/appData/coreflow-workspaces-data/backups:ro

      # Examples of narrowing, if you would rather:
      # - /Volume1/public/Media Library:/nas/Volume1/public/Media Library
      # - /Volume1/public/Software and Assets:/nas/Volume1/public/Software and Assets:ro
